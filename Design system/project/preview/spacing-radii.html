<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Spacing — Radii</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Corner radii</div>
    <div class="row gap-3" style="align-items: flex-end;">
      <div class="col gap-1" style="align-items: center;">
        <div style="width: 76px; height: 64px; background: var(--bg-2); border-radius: 6px;"></div>
        <div class="mono">r-sm · 6</div>
      </div>
      <div class="col gap-1" style="align-items: center;">
        <div style="width: 76px; height: 64px; background: var(--bg-2); border-radius: 10px;"></div>
        <div class="mono">r-md · 10</div>
      </div>
      <div class="col gap-1" style="align-items: center;">
        <div style="width: 76px; height: 64px; background: var(--bg-2); border-radius: 12px;"></div>
        <div class="mono">r-lg · 12 ★</div>
      </div>
      <div class="col gap-1" style="align-items: center;">
        <div style="width: 76px; height: 64px; background: var(--bg-2); border-radius: 16px;"></div>
        <div class="mono">r-xl · 16 ★</div>
      </div>
      <div class="col gap-1" style="align-items: center;">
        <div style="width: 76px; height: 64px; background: var(--bg-2); border-radius: 20px;"></div>
        <div class="mono">r-2xl · 20</div>
      </div>
      <div class="col gap-1" style="align-items: center;">
        <div style="width: 76px; height: 64px; background: var(--bg-2); border-radius: 9999px;"></div>
        <div class="mono">pill</div>
      </div>
    </div>
    <div class="ds-caption">★ default for buttons · overlays use r-xl (16) · thumbnails use r-md (10)</div>
  </div>
</div>
</body>
</html>
