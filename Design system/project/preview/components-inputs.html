<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Components — Form Inputs</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Inputs — filled bg-2 · rounded-xl · cobalt focus ring</div>
    <input class="field" placeholder="Liitä reseptin URL..." />
    <input class="field" placeholder="Enter barcode number" style="border-color: var(--brand-cobalt-400); box-shadow: 0 0 0 2px rgba(46,107,214,0.35);" value="7 311070 101014" />
    <div class="row gap-2" style="align-items: center;">
      <input class="field" style="flex:1" placeholder="Search products..." />
      <button class="btn brand-cobalt">Hae</button>
    </div>
    <div class="row gap-2" style="align-items: center;">
      <label class="row gap-2" style="align-items: center; color: var(--fg-2); font-size: 14px;">
        <span style="width: 40px; height: 22px; background: var(--brand-cobalt); border-radius: 11px; position: relative;">
          <span style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 9px;"></span>
        </span>
        Continuous scan
      </label>
      <label class="row gap-2" style="align-items: center; color: var(--fg-3); font-size: 14px;">
        <span style="width: 40px; height: 22px; background: var(--bg-3); border-radius: 11px; position: relative;">
          <span style="position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; background: #9CA3AF; border-radius: 9px;"></span>
        </span>
        Auto-optimize
      </label>
    </div>
  </div>
</div>
</body>
</html>
