<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Spacing — Shadow & elevation</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Shadow / elevation</div>
    <div class="row gap-4" style="padding: 20px 10px;">
      <div class="col gap-2" style="flex:1; align-items: center;">
        <div style="width: 100%; height: 64px; background: var(--bg-2); border-radius: 12px; box-shadow: var(--shadow-sm);"></div>
        <div class="mono">shadow-sm · row</div>
      </div>
      <div class="col gap-2" style="flex:1; align-items: center;">
        <div style="width: 100%; height: 64px; background: var(--bg-2); border-radius: 12px; box-shadow: var(--shadow-md);"></div>
        <div class="mono">shadow-md · card</div>
      </div>
      <div class="col gap-2" style="flex:1; align-items: center;">
        <div style="width: 100%; height: 64px; background: var(--bg-2); border-radius: 12px; box-shadow: var(--shadow-lg);"></div>
        <div class="mono">shadow-lg · toast</div>
      </div>
      <div class="col gap-2" style="flex:1; align-items: center;">
        <div style="width: 100%; height: 64px; background: var(--bg-2); border-radius: 16px; box-shadow: var(--shadow-xl);"></div>
        <div class="mono">shadow-xl · overlay</div>
      </div>
    </div>
    <div class="row gap-4" style="padding: 10px;">
      <div class="col gap-2" style="flex:1; align-items: center;">
        <div style="width: 100%; height: 48px; background: var(--brand-orange); border-radius: 12px; box-shadow: var(--glow-orange);"></div>
        <div class="mono">glow-orange</div>
      </div>
      <div class="col gap-2" style="flex:1; align-items: center;">
        <div style="width: 100%; height: 48px; background: var(--brand-cobalt); border-radius: 12px; box-shadow: var(--glow-cobalt);"></div>
        <div class="mono">glow-cobalt</div>
      </div>
      <div class="col gap-2" style="flex:1; align-items: center;">
        <div style="width: 100%; height: 48px; background: var(--xp-gold); border-radius: 12px; box-shadow: var(--glow-gold);"></div>
        <div class="mono" style="color: var(--fg-3)">glow-gold · XP only</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
