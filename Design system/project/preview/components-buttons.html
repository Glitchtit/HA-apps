<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Components — Buttons</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Buttons — filled · rounded-xl · sentence case</div>
    <div class="row gap-2" style="flex-wrap: wrap;">
      <button class="btn brand-cobalt">Hae resepti</button>
      <button class="btn brand-orange">Scan barcode</button>
      <button class="btn success">Keep in stock</button>
      <button class="btn warning">Open 1</button>
      <button class="btn danger">Consume all</button>
    </div>
    <div class="row gap-2">
      <button class="btn neutral">Cancel</button>
      <button class="btn ghost">Peruuta</button>
      <button class="btn brand-cobalt" disabled style="opacity:0.4; cursor: not-allowed;">Disabled</button>
    </div>
    <div class="ds-caption">Hover → one shade lighter · Active → one shade darker · Disabled → opacity 0.4, colour kept</div>
  </div>
</div>
</body>
</html>
