<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Components — Chips + Badges</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Chips — status pills + filters</div>
    <div class="row gap-2" style="flex-wrap: wrap;">
      <span class="chip" style="background: rgba(16,185,129,0.25); color: #6EE7B7;">✓ You</span>
      <span class="chip" style="background: rgba(245,158,11,0.25); color: #FCD34D;">▾ Pick</span>
      <span class="chip" style="background: rgba(0,71,171,0.3); color: var(--brand-cobalt-300);">4 annosta</span>
      <span class="chip" style="background: rgba(255,79,0,0.25); color: var(--brand-orange-300);">Level 12</span>
      <span class="chip" style="background: var(--bg-3); color: var(--fg-2);">🏡 Household</span>
    </div>
    <div class="label" style="margin-top: 6px;">Achievement / streak</div>
    <div class="row gap-2">
      <div style="padding: 10px 14px; background: var(--bg-2); border-radius: 12px; display: flex; align-items: center; gap: 10px; border: 2px solid var(--xp-gold); box-shadow: var(--glow-gold);">
        <span style="font-size: 28px;">🎖️</span>
        <div class="col">
          <span style="font-weight: 700; color: var(--xp-gold-soft); font-size: 13px;">7-day streak</span>
          <span style="font-size: 11px; color: var(--fg-3);">+50 XP bonus</span>
        </div>
      </div>
      <div style="padding: 10px 14px; background: var(--bg-2); border-radius: 12px; display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 28px;">🏆</span>
        <div class="col">
          <span style="font-weight: 700; font-size: 13px;">Level 12</span>
          <span style="font-size: 11px; color: var(--fg-3);">320 / 500 XP</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
