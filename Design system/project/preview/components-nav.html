<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Components — Nav</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Nav — tab bar (desktop) + bottom bar (mobile)</div>
    <div style="background: var(--bg-1); border-bottom: 1px solid var(--bg-2); padding: 0 8px; display: flex; gap: 0; overflow: hidden;">
      <button class="btn ghost" style="border-bottom: 2px solid var(--brand-orange); color: var(--brand-orange-300); border-radius: 0; padding: 10px 14px;">📊 Dashboard</button>
      <button class="btn ghost" style="border-bottom: 2px solid transparent; color: var(--fg-3); border-radius: 0; padding: 10px 14px;">📦 Products</button>
      <button class="btn ghost" style="border-bottom: 2px solid transparent; color: var(--fg-3); border-radius: 0; padding: 10px 14px;">🏪 Stock</button>
      <button class="btn ghost" style="border-bottom: 2px solid transparent; color: var(--fg-3); border-radius: 0; padding: 10px 14px;">🍽️ Recipes</button>
      <button class="btn ghost" style="border-bottom: 2px solid transparent; color: var(--fg-3); border-radius: 0; padding: 10px 14px;">⚙️ Settings</button>
    </div>
    <div style="background: var(--bg-2); border-top: 1px solid var(--line-1); display: flex; justify-content: space-around; padding: 6px 0;">
      <div class="col" style="align-items: center; gap: 2px; color: var(--brand-orange-300);">
        <span style="font-size: 22px;">🏠</span><span style="font-size: 10px;">Dashboard</span>
      </div>
      <div class="col" style="align-items: center; gap: 2px; color: var(--fg-4); filter: grayscale(1); opacity: 0.6;">
        <span style="font-size: 22px;">📋</span><span style="font-size: 10px;">Chores</span>
      </div>
      <div class="col" style="align-items: center; gap: 2px; color: var(--fg-4); filter: grayscale(1); opacity: 0.6;">
        <span style="font-size: 22px;">🐾</span><span style="font-size: 10px;">Pet</span>
      </div>
      <div class="col" style="align-items: center; gap: 2px; color: var(--fg-4); filter: grayscale(1); opacity: 0.6;">
        <span style="font-size: 22px;">🏆</span><span style="font-size: 10px;">Leader</span>
      </div>
      <div class="col" style="align-items: center; gap: 2px; color: var(--fg-4); filter: grayscale(1); opacity: 0.6;">
        <span style="font-size: 22px;">⚙️</span><span style="font-size: 10px;">Settings</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
