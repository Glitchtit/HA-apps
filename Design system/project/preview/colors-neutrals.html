<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Colors — Neutrals</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Surface ladder · bg-0 → bg-4</div>
    <div class="row gap-2">
      <div class="swatch" style="flex:1; background: var(--bg-0); border: 1px solid var(--line-2);"><span class="hex">bg-0 · #0A0D14</span></div>
      <div class="swatch" style="flex:1; background: var(--bg-1);"><span class="hex">bg-1 · #111827</span></div>
      <div class="swatch" style="flex:1; background: var(--bg-2);"><span class="hex">bg-2 · #1F2937</span></div>
      <div class="swatch" style="flex:1; background: var(--bg-3);"><span class="hex">bg-3 · #374151</span></div>
      <div class="swatch" style="flex:1; background: var(--bg-4);"><span class="hex">bg-4 · #4B5563</span></div>
    </div>
    <div class="label" style="margin-top:8px">Foreground · fg-1 → fg-4</div>
    <div class="row gap-2" style="background: var(--bg-2); border-radius: 12px; padding: 14px;">
      <div style="flex:1; color: var(--fg-1); font-size: 18px; font-weight: 600;">fg-1 Primary</div>
      <div style="flex:1; color: var(--fg-2); font-size: 18px;">fg-2 Secondary</div>
      <div style="flex:1; color: var(--fg-3); font-size: 18px;">fg-3 Muted</div>
      <div style="flex:1; color: var(--fg-4); font-size: 18px;">fg-4 Disabled</div>
    </div>
  </div>
</div>
</body>
</html>
