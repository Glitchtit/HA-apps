<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Components — Toasts</title>
</head>
<body>
<div class="card">
  <div class="col gap-2">
    <div class="label">Toast stack — top-right · shadow-lg · rounded-lg</div>
    <div style="padding: 12px 16px; background: var(--success); color: #fff; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 500;">Resepti "Lohikeitto" tallennettu!</div>
    <div style="padding: 12px 16px; background: var(--warning); color: #fff; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 500;">⚠️ Yhteys katkesi — lataa sivu uudelleen</div>
    <div style="padding: 12px 16px; background: var(--danger); color: #fff; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 500;">Reseptin haku epäonnistui</div>
    <div style="padding: 0; background: var(--bg-3); color: #fff; border-radius: 10px; box-shadow: var(--shadow-lg); overflow: hidden;">
      <div style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; font-size: 14px;">
        <span style="flex:1">Removed 1 × Valio maitorahka</span>
        <button style="background:none; border:none; color: var(--success); font-weight: 600; font-size: 14px; text-decoration: underline;">Undo</button>
      </div>
      <div style="height: 3px; background: var(--success); width: 65%;"></div>
    </div>
  </div>
</div>
</body>
</html>
