<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Colors — Semantic</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Semantic signals — inherited from source apps</div>
    <div class="row gap-2">
      <div class="swatch" style="flex:1; background: var(--success);"><span class="hex">success · #10B981</span></div>
      <div class="swatch" style="flex:1; background: var(--warning);"><span class="hex">warning · #F59E0B</span></div>
      <div class="swatch" style="flex:1; background: var(--danger);"><span class="hex">danger · #EF4444</span></div>
      <div class="swatch" style="flex:1; background: var(--xp-gold);"><span class="hex" style="color: #111; background: rgba(255,255,255,0.7)">xp-gold · #FBBF24</span></div>
    </div>
    <div class="label" style="margin-top:4px">Tinted status cells — /40 opacity + -300 text</div>
    <div class="col gap-2">
      <div style="padding: 10px 14px; border-radius: 10px; background: rgba(16,185,129,0.25); color: #6EE7B7; font-weight: 500; font-size: 14px;">✅  In stock — 4 kpl · lohifileet</div>
      <div style="padding: 10px 14px; border-radius: 10px; background: rgba(245,158,11,0.25); color: #FCD34D; font-weight: 500; font-size: 14px;">⚠️  Opened — 1 kpl · smetana</div>
      <div style="padding: 10px 14px; border-radius: 10px; background: rgba(239,68,68,0.25); color: #FCA5A5; font-weight: 500; font-size: 14px;">❌  Missing — tilli</div>
    </div>
  </div>
</div>
</body>
</html>
