<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Spacing — Scale</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Spacing — 4px grid</div>
    <div class="col gap-2" style="font-family: var(--font-mono); font-size: 12px; color: var(--fg-3);">
      <div class="row gap-3" style="align-items: center;"><span style="width:44px;">s-1</span><div style="height: 10px; width: 4px; background: var(--brand-orange);"></div><span>4</span></div>
      <div class="row gap-3" style="align-items: center;"><span style="width:44px;">s-2</span><div style="height: 10px; width: 8px; background: var(--brand-orange);"></div><span>8</span></div>
      <div class="row gap-3" style="align-items: center;"><span style="width:44px;">s-3</span><div style="height: 10px; width: 12px; background: var(--brand-orange);"></div><span>12</span></div>
      <div class="row gap-3" style="align-items: center;"><span style="width:44px;">s-4</span><div style="height: 10px; width: 16px; background: var(--brand-orange);"></div><span>16</span></div>
      <div class="row gap-3" style="align-items: center;"><span style="width:44px;">s-6</span><div style="height: 10px; width: 24px; background: var(--brand-orange);"></div><span>24</span></div>
      <div class="row gap-3" style="align-items: center;"><span style="width:44px;">s-8</span><div style="height: 10px; width: 32px; background: var(--brand-orange);"></div><span>32</span></div>
      <div class="row gap-3" style="align-items: center;"><span style="width:44px;">s-12</span><div style="height: 10px; width: 48px; background: var(--brand-orange);"></div><span>48</span></div>
      <div class="row gap-3" style="align-items: center;"><span style="width:44px;">s-16</span><div style="height: 10px; width: 64px; background: var(--brand-orange);"></div><span>64</span></div>
    </div>
  </div>
</div>
</body>
</html>
