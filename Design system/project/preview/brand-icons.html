<title>Brand — Iconography</title>

<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Iconography — emoji-first</div>
    <div class="row gap-2" style="flex-wrap: wrap;">
      <div style="padding: 10px 14px; background: var(--bg-2); border-radius: 12px; display: flex; align-items: center; gap: 10px;"><span style="font-size: 24px;">🗄️</span><span>Storage</span></div>
      <div style="padding: 10px 14px; background: var(--bg-2); border-radius: 12px; display: flex; align-items: center; gap: 10px;"><span style="font-size: 24px;">📦</span><span>Stock</span></div>

      <div style="padding: 10px 14px; background: var(--bg-2); border-radius: 12px; display: flex; align-items: center; gap: 10px;"><span style="font-size: 24px;">🐾</span><span>Pet</span></div>
    </div>
    <div class="row gap-2" style="flex-wrap: wrap;">
      <div style="padding: 8px 12px; background: var(--bg-2); border-radius: 10px; font-size: 20px;">🏠</div>
      <div style="padding: 8px 12px; background: var(--bg-2); border-radius: 10px; font-size: 20px;">📋</div>
      <div style="padding: 8px 12px; background: var(--bg-2); border-radius: 10px; font-size: 20px;">✅</div>
      <div style="padding: 8px 12px; background: var(--bg-2); border-radius: 10px; font-size: 20px;">🏆</div>

      <div style="padding: 8px 12px; background: var(--bg-2); border-radius: 10px; font-size: 20px;">⚙️</div>
      <div style="padding: 8px 12px; background: var(--bg-2); border-radius: 10px; font-size: 20px;">🛒</div>
      <div style="padding: 8px 12px; background: var(--bg-2); border-radius: 10px; font-size: 20px;">📍</div>

    </div>
    <div class="ds-caption">Emoji for identity · Unicode (▾ ✕ ← → ↓) for inline glyphs · Lucide via CDN only when geometric icons required.</div>
