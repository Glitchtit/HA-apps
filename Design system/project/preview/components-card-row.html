<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Components — Cards</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="label">Card + Row — the universal product/stock row</div>
    <div style="background: var(--bg-2); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm);">
      <div style="padding: 10px 14px; background: rgba(0,71,171,0.2); color: var(--brand-cobalt-300); display: flex; align-items: center; justify-content: space-between; font-weight: 600;">
        <span>Maitotuotteet <span class="chip" style="background: rgba(0,71,171,0.3); color: var(--brand-cobalt-300); margin-left: 6px;">4</span></span>
        <span style="opacity: 0.7;">▲</span>
      </div>
      <div class="row gap-3" style="padding: 10px 14px; align-items: center; border-top: 1px solid var(--line-1);">
        <div style="width: 48px; height: 48px; border-radius: 10px; background: var(--bg-3); display: flex; align-items: center; justify-content: center; font-size: 24px;">🥫</div>
        <div style="flex:1; min-width: 0;">
          <div style="font-weight: 500; color: var(--fg-1);">Valio maitorahka 250 g</div>
          <div style="font-size: 13px; color: var(--fg-3);">3 in stock (1 opened)</div>
        </div>
      </div>
      <div class="row gap-3" style="padding: 10px 14px; align-items: center; border-top: 1px solid var(--line-1);">
        <div style="width: 48px; height: 48px; border-radius: 10px; background: var(--bg-3); display: flex; align-items: center; justify-content: center; font-size: 24px;">🥫</div>
        <div style="flex:1; min-width: 0;">
          <div style="font-weight: 500; color: var(--fg-1);">Oikea voi 500 g</div>
          <div style="font-size: 13px; color: var(--fg-3);">1 in stock</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
