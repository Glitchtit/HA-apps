<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Components — Overlay dialog</title>
</head>
<body>
<div class="card">
  <div class="label" style="margin-bottom: 12px;">Action sheet — max-w-sm · rounded-2xl · backdrop-blur</div>
  <div style="background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); padding: 24px; border-radius: 16px; display: flex; justify-content: center;">
    <div style="background: var(--bg-2); border-radius: 16px; box-shadow: var(--shadow-xl); width: 100%; max-width: 360px; overflow: hidden;">
      <div style="display: flex; justify-content: flex-end; padding: 8px;">
        <button style="background:none; border:none; color: var(--fg-3); font-size: 20px; padding: 4px 10px; cursor: pointer;">✕</button>
      </div>
      <div style="display: flex; justify-content: center; padding: 0 24px 12px;">
        <div style="width: 108px; height: 108px; background: var(--bg-3); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 54px;">🥫</div>
      </div>
      <div style="text-align: center; padding: 0 24px 16px;">
        <div style="font-size: 17px; font-weight: 700; color: var(--fg-1);">Valio maitorahka 250 g</div>
        <div style="color: var(--fg-3); font-size: 14px; margin-top: 2px;">3 in stock (1 opened)</div>
      </div>
      <div style="padding: 0 24px 20px; display: flex; flex-direction: column; gap: 10px;">
        <div class="row gap-2">
          <button class="btn success" style="flex:1;">Keep in stock</button>
          <button class="btn success" style="width: 52px;">+1</button>
          <button class="btn danger" style="width: 52px;">−1</button>
        </div>
        <button class="btn warning">Open 1</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
