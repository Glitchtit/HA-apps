<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<title>Colors — Brand</title>
</head>
<body>
<div class="card">
  <div class="col gap-3">
    <div class="row gap-3">
      <div class="col gap-2" style="flex:1">
        <div class="label">International Orange</div>
        <div class="row gap-2">
          <div class="swatch" style="flex:1; background: var(--brand-orange-100);"><span class="hex" style="background: rgba(0,0,0,0.25)">#FFE3D2</span></div>
          <div class="swatch" style="flex:1; background: var(--brand-orange-300);"><span class="hex">#FFA27A</span></div>
          <div class="swatch" style="flex:1.5; background: var(--brand-orange); box-shadow: var(--glow-orange);"><span class="hex">#FF4F00</span></div>
          <div class="swatch" style="flex:1; background: var(--brand-orange-600);"><span class="hex">#E04400</span></div>
        </div>
      </div>
    </div>
    <div class="row gap-3">
      <div class="col gap-2" style="flex:1">
        <div class="label">Cobalt Blue</div>
        <div class="row gap-2">
          <div class="swatch" style="flex:1; background: var(--brand-cobalt-100);"><span class="hex" style="background: rgba(0,0,0,0.25)">#D3E0F7</span></div>
          <div class="swatch" style="flex:1; background: var(--brand-cobalt-300);"><span class="hex">#5E8EE8</span></div>
          <div class="swatch" style="flex:1.5; background: var(--brand-cobalt); box-shadow: var(--glow-cobalt);"><span class="hex">#0047AB</span></div>
          <div class="swatch" style="flex:1; background: var(--brand-cobalt-600);"><span class="hex">#003A8C</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
